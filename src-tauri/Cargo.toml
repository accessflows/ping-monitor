[package]
name = "ping-monitor"
version = "0.1.0"
description = "Desktop ping monitor for IP addresses and domains"
authors = ["accessflows"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ping_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ping = "0.6"
rfd = "0.15"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
